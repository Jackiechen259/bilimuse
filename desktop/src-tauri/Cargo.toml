[package]
name = "bilimuse-desktop"
version = "0.2.0"
description = "BiliMuse 桌面壳：Tauri 窗口 + Python 引擎边车"
authors = ["Jackiechen259"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
