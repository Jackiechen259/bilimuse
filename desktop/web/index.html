<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiliMuse</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --line: rgba(242, 240, 234, 0.1);
        --accent: #f2f0ea;
        --accent-2: #7f796e;
        --text: #f2f0ea;
        --muted: #9a948a;
        --paper: #f2f0ea;
        --ink: #0b0b0c;
      }

      * { box-sizing: border-box; }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(720px 460px at 50% 34%, rgba(242, 240, 234, 0.06), transparent 70%),
          radial-gradient(520px 340px at 76% 76%, rgba(242, 240, 234, 0.03), transparent 72%),
          var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        user-select: none;
        overflow: hidden;
      }

      /* 无边框窗口的启动页标题栏：和进入主界面后一样，拖动/双击都落在这一条上 */
      .chrome {
        position: relative;
        z-index: 2;
        flex: none;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px 0 14px;
        background: linear-gradient(180deg, rgba(17, 17, 18, 0.94), rgba(11, 11, 12, 0.8));
        border-bottom: 1px solid var(--line);
      }

      .chrome-brand {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .chrome-mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
      }

      .chrome-name {
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: var(--text);
      }

      .chrome-tag {
        padding-left: 9px;
        border-left: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.3px;
      }

      .chrome-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .chrome-controls[hidden] { display: none; }

      /* macOS / Linux 保留系统标题栏时，页面里不再重复一条自绘标题栏 */
      html.native-titlebar .chrome { display: none; }
      html.native-titlebar .bar { top: 0; }

      .chrome-btn {
        width: 34px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--muted);
        transition: background 0.15s ease, color 0.15s ease;
      }

      .chrome-btn svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .chrome-btn:hover { background: rgba(242, 240, 234, 0.075); color: var(--text); }
      .chrome-btn:active { background: rgba(242, 240, 234, 0.12); }
      .chrome-btn:focus-visible { outline: 2px solid rgba(242, 240, 234, 0.75); outline-offset: -2px; }
      .chrome-btn-close:hover { background: #e5484d; color: #fff; }
      .chrome-btn-close:active { background: #cf3b40; color: #fff; }

      .chrome-btn .glyph-restore { display: none; }
      .chrome-btn.is-maximized .glyph-max { display: none; }
      .chrome-btn.is-maximized .glyph-restore { display: block; }

      .stage {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 0;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
      }

      .mark {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.5));
        animation: float 4.5s ease-in-out infinite;
      }

      h1 {
        margin: 6px 0 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.3px;
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 12.5px;
        letter-spacing: 0.4px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 10px;
        padding: 9px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(242, 240, 234, 0.04);
        color: var(--muted);
        font-size: 12.5px;
        max-width: 560px;
        transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      .status.error {
        color: #ffb4b4;
        border-color: rgba(255, 120, 120, 0.35);
        background: rgba(255, 90, 90, 0.08);
        border-radius: 14px;
        line-height: 1.7;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(242, 240, 234, 0.4);
        animation: pulse 1.4s ease-out infinite;
      }

      .status.error .dot { display: none; }

      /* 启动进度：贴着标题栏底边跑，像一条加载中的发丝 */
      .bar {
        position: fixed;
        left: 0;
        top: 40px;
        height: 2px;
        width: 36%;
        background: linear-gradient(90deg, transparent, rgba(242, 240, 234, 0.8), transparent);
        opacity: 0.45;
        animation: slide 1.6s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(242, 240, 234, 0.35); opacity: 1; }
        70% { box-shadow: 0 0 0 9px rgba(242, 240, 234, 0); opacity: 0.75; }
        100% { box-shadow: 0 0 0 0 rgba(242, 240, 234, 0); opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes slide {
        0% { transform: translateX(-40%); }
        100% { transform: translateX(300%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark, .dot, .bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <header class="chrome" data-tauri-drag-region="deep">
      <div class="chrome-brand">
        <svg class="chrome-mark" viewBox="0 0 108 108" aria-hidden="true">
          <rect width="108" height="108" rx="26" fill="#F2F0EA" />
          <g transform="translate(-0.5 1)" fill="#0B0B0C">
            <ellipse cx="43.5" cy="66" rx="9.4" ry="7.1" transform="rotate(-20 43.5 66)" />
            <ellipse cx="64" cy="62" rx="9.4" ry="7.1" transform="rotate(-20 64 62)" />
            <rect x="48.4" y="34" width="5.2" height="32" rx="2.6" />
            <rect x="69" y="30.2" width="5.2" height="32" rx="2.6" />
            <path d="M48.4 34 L74.2 30.2 L74.2 37 L48.4 40.8 Z" />
          </g>
        </svg>
        <span class="chrome-name">BiliMuse</span>
        <span class="chrome-tag">桌面版</span>
      </div>

      <div class="chrome-controls" id="chrome-controls" hidden>
        <button class="chrome-btn" id="win-min" type="button" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
        <button class="chrome-btn" id="win-max" type="button" title="最大化" aria-label="最大化">
          <svg class="glyph-max" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="1.8" />
          </svg>
          <svg class="glyph-restore" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5h8.7a1.8 1.8 0 0 1 1.8 1.8v8.7" />
            <rect x="5.5" y="8" width="11" height="11" rx="1.8" />
          </svg>
        </button>
        <button class="chrome-btn chrome-btn-close" id="win-close" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg>
        </button>
      </div>
    </header>

    <div class="bar"></div>

    <div class="stage">
      <main class="splash">
        <svg class="mark" viewBox="0 0 108 108" fill="none" aria-hidden="true">
          <rect width="108" height="108" rx="24" fill="#F2F0EA" />
          <circle cx="54" cy="54" r="31.5" fill="none" stroke="#0B0B0C" stroke-opacity="0.14" stroke-width="0.8" />
          <circle cx="54" cy="54" r="23.6" fill="none" stroke="#0B0B0C" stroke-opacity="0.1" stroke-width="0.8" />
          <g transform="translate(-0.5 1)" fill="#0B0B0C">
            <ellipse cx="43.5" cy="66" rx="9.4" ry="7.1" transform="rotate(-20 43.5 66)" />
            <ellipse cx="64" cy="62" rx="9.4" ry="7.1" transform="rotate(-20 64 62)" />
            <rect x="48.4" y="34" width="5.2" height="32" rx="2.6" />
            <rect x="69" y="30.2" width="5.2" height="32" rx="2.6" />
            <path d="M48.4 34 L74.2 30.2 L74.2 37 L48.4 40.8 Z" />
          </g>
        </svg>

        <h1>BiliMuse</h1>
        <p class="tagline">把收藏夹变成歌单 · 本地播放器</p>

        <div class="status" id="status">
          <span class="dot"></span>
          <span id="status-text">正在启动本地引擎…</span>
        </div>
      </main>
    </div>

    <script>
      // Rust 端启动失败时会调用它，把错误直接显示在启动页上
      window.__bilimuseError = function (message) {
        var box = document.getElementById('status');
        var text = document.getElementById('status-text');
        box.classList.add('error');
        text.textContent = message;
      };

      // 只有 Windows 壳是无边框窗口；macOS / Linux 保留系统标题栏，
      // 这时隐藏自绘标题栏，避免和系统标题栏重复。
      (function () {
        if (!/Windows/i.test(navigator.userAgent)) {
          document.documentElement.classList.add('native-titlebar');
          return;
        }

        var tauri = window.__TAURI__;
        var win = tauri && tauri.window ? tauri.window.getCurrentWindow() : null;
        var controls = document.getElementById('chrome-controls');
        if (!win) return;

        controls.hidden = false;
        var maxButton = document.getElementById('win-max');
        function syncMaximized() {
          win.isMaximized().then(function (maximized) {
            maxButton.classList.toggle('is-maximized', maximized);
            maxButton.title = maximized ? '还原' : '最大化';
            maxButton.setAttribute('aria-label', maxButton.title);
          }).catch(function () {});
        }

        document.getElementById('win-min').addEventListener('click', function () {
          win.minimize().catch(function () {});
        });
        maxButton.addEventListener('click', function () {
          win.toggleMaximize().catch(function () {});
        });
        document.getElementById('win-close').addEventListener('click', function () {
          win.close().catch(function () {});
        });
        win.onResized(syncMaximized).catch(function () {});
        syncMaximized();
      })();
    </script>
  </body>
</html>
