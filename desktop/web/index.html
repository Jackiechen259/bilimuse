<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiliMuse</title>
    <style>
      :root {
        --bg: #0b0d12;
        --accent: #fb7299;
        --accent-2: #00aeec;
        --text: #e7e9f3;
        --muted: #8b90a6;
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(680px 420px at 50% 38%, rgba(251, 114, 153, 0.16), transparent 70%),
          radial-gradient(520px 340px at 72% 70%, rgba(0, 174, 236, 0.12), transparent 72%),
          var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        user-select: none;
        overflow: hidden;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
      }

      .mark {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 14px 36px rgba(251, 114, 153, 0.28))
          drop-shadow(0 8px 24px rgba(0, 174, 236, 0.18));
        animation: float 4.5s ease-in-out infinite;
      }

      h1 {
        margin: 6px 0 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.3px;
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 12.5px;
        letter-spacing: 0.4px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 10px;
        padding: 9px 18px;
        border: 1px solid rgba(251, 114, 153, 0.18);
        border-radius: 999px;
        background: rgba(251, 114, 153, 0.06);
        color: #c3c8dc;
        font-size: 12.5px;
        max-width: 560px;
        transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      .status.error {
        color: #ffb4b4;
        border-color: rgba(255, 120, 120, 0.35);
        background: rgba(255, 90, 90, 0.08);
        border-radius: 14px;
        line-height: 1.7;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(251, 114, 153, 0.6);
        animation: pulse 1.4s ease-out infinite;
      }

      .status.error .dot { display: none; }

      .bar {
        position: fixed;
        left: 0;
        top: 0;
        height: 2px;
        width: 36%;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
        opacity: 0.8;
        animation: slide 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(251, 114, 153, 0.55); opacity: 1; }
        70% { box-shadow: 0 0 0 9px rgba(251, 114, 153, 0); opacity: 0.75; }
        100% { box-shadow: 0 0 0 0 rgba(251, 114, 153, 0); opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes slide {
        0% { transform: translateX(-40%); }
        100% { transform: translateX(300%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark, .dot, .bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>

    <main class="splash">
      <svg class="mark" viewBox="0 0 108 108" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="splash-tile" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FB7299" />
            <stop offset="0.5" stop-color="#A55EEA" />
            <stop offset="1" stop-color="#00AEEC" />
          </linearGradient>
          <linearGradient id="splash-disc" x1="54" y1="22.5" x2="54" y2="85.5" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#14192A" />
            <stop offset="1" stop-color="#06080E" />
          </linearGradient>
        </defs>
        <rect width="108" height="108" rx="24" fill="url(#splash-tile)" />
        <circle cx="54" cy="54" r="31.5" fill="url(#splash-disc)" />
        <circle cx="54" cy="54" r="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="0.65" />
        <circle cx="54" cy="54" r="23.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="0.65" />
        <g transform="translate(-0.5 1)" fill="#F5F7FF">
          <ellipse cx="43.5" cy="66" rx="9.4" ry="7.1" transform="rotate(-20 43.5 66)" />
          <ellipse cx="64" cy="62" rx="9.4" ry="7.1" transform="rotate(-20 64 62)" />
          <rect x="48.4" y="34" width="5.2" height="32" rx="2.6" />
          <rect x="69" y="30.2" width="5.2" height="32" rx="2.6" />
          <path d="M48.4 34 L74.2 30.2 L74.2 37 L48.4 40.8 Z" />
        </g>
      </svg>

      <h1>BiliMuse</h1>
      <p class="tagline">把收藏夹变成歌单 · 本地播放器</p>

      <div class="status" id="status">
        <span class="dot"></span>
        <span id="status-text">正在启动本地引擎…</span>
      </div>
    </main>

    <script>
      // Rust 端启动失败时会调用它，把错误直接显示在启动页上
      window.__bilimuseError = function (message) {
        var box = document.getElementById('status');
        var text = document.getElementById('status-text');
        box.classList.add('error');
        text.textContent = message;
      };
    </script>
  </body>
</html>
