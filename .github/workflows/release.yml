name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ""
            args: "--bundles appimage,deb"
          - platform: windows-latest
            target: ""
            args: "--bundles nsis"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      # 让 scripts/build_sidecar.sh 直接使用 setup-python 提供的解释器；
      # 该脚本在 Windows 上不会自己找 .venv/Scripts/python.exe。
      PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify desktop version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          PKG_VERSION="$(node -p "require('./desktop/package.json').version")"
          if [[ "${APP_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::tauri.conf.json (${APP_VERSION}) 与 package.json (${PKG_VERSION}) 版本不一致"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "v${APP_VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与桌面版版本 v${APP_VERSION} 不一致"
            exit 1
          fi
          echo "桌面版版本：v${APP_VERSION}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Install Python sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          tagName: v__VERSION__
          releaseName: "BiliMuse v__VERSION__"
          releaseBody: |
            桌面版与安卓版自动更新发布。

            GitHub Release 中的 `latest.json` 是桌面版更新端点；安卓版 APK 可直接在应用内检查、下载并安装。
            Tauri 安装包与 `.sig` 文件由 Tauri updater 签名校验；安卓 APK 在安装前校验包名、versionCode 与签名。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Android version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::无法从 '${VERSION}' 解析版本号"
            exit 1
          fi
          BASE="${VERSION%%-*}"
          BASE="${BASE%%+*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${BASE}"
          CODE=$((10#${MAJOR} * 10000 + 10#${MINOR} * 100 + 10#${PATCH}))
          if (( CODE <= 0 )); then
            echo "::error::versionCode 必须大于 0"
            exit 1
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "安卓版本：${VERSION}（versionCode ${CODE}）"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          # GitHub Secrets 可能带上末尾换行；写进 GITHUB_ENV 前先去掉 CR/LF。
          STORE_PASSWORD="$(printf '%s' "${ANDROID_KEYSTORE_PASSWORD:-}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "${ANDROID_KEY_ALIAS:-}" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "${ANDROID_KEY_PASSWORD:-}" | tr -d '\r\n')"
          if [[ -z "${STORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::error::已配置 ANDROID_KEYSTORE_BASE64，但 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 不完整"
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/bilimuse-release.jks"
          {
            echo "BILIMUSE_ANDROID_KEYSTORE=${RUNNER_TEMP}/bilimuse-release.jks"
            echo "BILIMUSE_ANDROID_STORE_PASSWORD=${STORE_PASSWORD}"
            echo "BILIMUSE_ANDROID_KEY_ALIAS=${KEY_ALIAS}"
            echo "BILIMUSE_ANDROID_KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Warn about debug signing fallback
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次 APK 会回退到仓库内的公开调试密钥。正式发布请在 Secrets 中配置 Android 签名。"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PbilimuseVersionName="${{ steps.version.outputs.name }}" \
            -PbilimuseVersionCode="${{ steps.version.outputs.code }}"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/BiliMuse-android-${{ steps.version.outputs.name }}.apk"
          sha256sum dist/*.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: BiliMuse v${{ steps.version.outputs.name }}
          body: |
            桌面版与安卓版自动更新发布。

            GitHub Release 中的 `latest.json` 是桌面版更新端点；安卓版 APK 可直接在应用内检查、下载并安装。
            Tauri 安装包与 `.sig` 文件由 Tauri updater 签名校验；安卓 APK 在安装前校验包名、versionCode 与签名。
          draft: true
          files: dist/*.apk
          fail_on_unmatched_files: true
